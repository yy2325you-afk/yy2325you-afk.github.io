<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김채율 입력 중 프로그램</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f5f6fa;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 80%;
        }
        #result {
            font-size: 20px;
            font-weight: bold;
            color: #2f3640;
            margin-bottom: 20px;
            word-break: break-all;
            line-height: 1.5;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #353b48;
            color: white;
            border: none;
            border-radius: 6px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #718093;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 화면에 표시될 텍스트 영역 -->
    <div id="result">김채율 님이 입력 중입니다...</div>
    
    <!-- 사람을 추가하는 버튼 -->
    <button onclick="addPerson()">김채율 추가하기</button>
</div>

<script>
    // 현재 김채율의 수 (기본 1명)
    let count = 1;

    function addPerson() {
        count++; // 버튼을 누를 때마다 숫자 1씩 증가
        
        // "김채율: "을 숫자만큼 반복 생성
        let text = "";
        for (let i = 0; i < count; i++) {
            text += "김채율: ";
        }
        
        // 마지막 글자 뒤의 공백을 제거하고 "님이 입력 중입니다..." 결합
        document.getElementById("result").innerText = text.trim() + " 님이 입력 중입니다...";
    }
</script>

</body>
</html>
